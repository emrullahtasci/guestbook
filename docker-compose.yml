services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    # No published port: the app is only reachable through Nginx
    expose:
      - "5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-guestbook}:${POSTGRES_PASSWORD:-guestbook}@db:5432/${POSTGRES_DB:-guestbook}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret}
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guestbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guestbook}
      POSTGRES_DB: ${POSTGRES_DB:-guestbook}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guestbook}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db-data:
